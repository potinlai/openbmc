[Unit]
Description=VSER12 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER12.conf
ConditionPathExists=/dev/tcu-muxer/cpu0/12

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER12.conf /dev/tcu-muxer/cpu0/12
SyslogIdentifier=VSER12-console-server
Restart=always
