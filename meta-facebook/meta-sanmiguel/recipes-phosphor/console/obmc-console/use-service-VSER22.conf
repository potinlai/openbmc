[Unit]
Description=VSER22 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER22.conf
ConditionPathExists=/dev/tcu-muxer/cpu1/6

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER22.conf /dev/tcu-muxer/cpu1/6
SyslogIdentifier=VSER22-console-server
Restart=always
