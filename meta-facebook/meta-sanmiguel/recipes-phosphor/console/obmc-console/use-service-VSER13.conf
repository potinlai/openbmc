[Unit]
Description=VSER13 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER13.conf
ConditionPathExists=/dev/tcu-muxer/cpu0/13

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER13.conf /dev/tcu-muxer/cpu0/13
SyslogIdentifier=VSER13-console-server
Restart=always
