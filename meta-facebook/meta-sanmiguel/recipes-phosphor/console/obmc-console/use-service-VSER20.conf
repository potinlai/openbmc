[Unit]
Description=VSER20 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER20.conf
ConditionPathExists=/dev/tcu-muxer/cpu1/4

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER20.conf /dev/tcu-muxer/cpu1/4
SyslogIdentifier=VSER20-console-server
Restart=always
