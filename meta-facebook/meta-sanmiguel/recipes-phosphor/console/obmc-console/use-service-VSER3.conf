[Unit]
Description=VSER3 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER3.conf
ConditionPathExists=/dev/tcu-muxer/cpu0/3

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER3.conf /dev/tcu-muxer/cpu0/3
SyslogIdentifier=VSER3-console-server
Restart=always
