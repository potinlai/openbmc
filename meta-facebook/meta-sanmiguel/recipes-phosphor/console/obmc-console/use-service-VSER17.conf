[Unit]
Description=VSER17 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER17.conf
ConditionPathExists=/dev/tcu-muxer/cpu1/1

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER17.conf /dev/tcu-muxer/cpu1/1
SyslogIdentifier=VSER17-console-server
Restart=always
