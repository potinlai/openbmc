[Unit]
Description=VSER10 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER10.conf
ConditionPathExists=/dev/tcu-muxer/cpu0/10

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER10.conf /dev/tcu-muxer/cpu0/10
SyslogIdentifier=VSER10-console-server
Restart=always
