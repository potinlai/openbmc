[Unit]
Description=VSER9 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER9.conf
ConditionPathExists=/dev/tcu-muxer/cpu0/9

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER9.conf /dev/tcu-muxer/cpu0/9
SyslogIdentifier=VSER9-console-server
Restart=always
