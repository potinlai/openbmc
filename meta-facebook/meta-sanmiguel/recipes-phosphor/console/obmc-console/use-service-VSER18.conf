[Unit]
Description=VSER18 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER18.conf
ConditionPathExists=/dev/tcu-muxer/cpu1/2

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER18.conf /dev/tcu-muxer/cpu1/2
SyslogIdentifier=VSER18-console-server
Restart=always
