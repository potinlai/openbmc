[Unit]
Description=VSER6 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER6.conf
ConditionPathExists=/dev/tcu-muxer/cpu0/6

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER6.conf /dev/tcu-muxer/cpu0/6
SyslogIdentifier=VSER6-console-server
Restart=always
