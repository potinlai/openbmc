[Unit]
Description=VSER4 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER4.conf
ConditionPathExists=/dev/tcu-muxer/cpu0/4

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER4.conf /dev/tcu-muxer/cpu0/4
SyslogIdentifier=VSER4-console-server
Restart=always
