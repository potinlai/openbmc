[Unit]
Description=VSER27 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER27.conf
ConditionPathExists=/dev/tcu-muxer/cpu1/11

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER27.conf /dev/tcu-muxer/cpu1/11
SyslogIdentifier=VSER27-console-server
Restart=always
