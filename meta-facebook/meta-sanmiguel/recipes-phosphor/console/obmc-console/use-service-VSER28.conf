[Unit]
Description=VSER28 Console Server
ConditionPathExists=/etc/obmc-console/server.VSER28.conf
ConditionPathExists=/dev/tcu-muxer/cpu1/12

[Service]
# Instance ID is the VUART basename
ExecStart=
ExecStart=/usr/sbin/obmc-console-server --config /etc/obmc-console/server.VSER28.conf /dev/tcu-muxer/cpu1/12
SyslogIdentifier=VSER28-console-server
Restart=always
